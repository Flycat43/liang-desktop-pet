name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            command: npm run dist:mac
            artifact: macos
          - os: windows-latest
            command: npm run dist:win
            artifact: windows
          - os: ubuntu-latest
            command: npm run dist:linux
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v5
        with:
          name: dist-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.yml
            dist/*.yaml
            dist/*.blockmap

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/liang-harness-plugin/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: plugins/liang-harness-plugin
      - run: mkdir -p release
      - run: npm pack --pack-destination "$GITHUB_WORKSPACE/release"
        working-directory: plugins/liang-harness-plugin
      - run: npm run release:plugin:prepare -- "$GITHUB_WORKSPACE/release"
      - uses: actions/upload-artifact@v5
        with:
          name: dist-plugin
          if-no-files-found: error
          retention-days: 14
          path: release/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, plugin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: dist-*
          merge-multiple: true
          path: release
      - run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
